[build-system]
# 77 is where setuptools learned to read `license` as an SPDX expression.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cad-backend"
version = "0.1.0"
description = "Planner-first AI CAD backend"
readme = "README.md"
# The text lives in LICENSE at the repo root. license-files cannot point above
# the project directory, so the wheel carries the expression and not the file.
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  # Pinned exactly: a new black or ruff release reformats or relints code nobody
  # touched, and CI goes red on a day this repo did not change.
  "black==26.5.1",
  "ruff==0.16.3",
]

# Without this, flat-layout auto-discovery walks backend/ and refuses to build the
# moment it finds a second package-shaped directory beside app/. runtime/ is one,
# and it appears on the first build, so a checkout stops installing once it works.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

